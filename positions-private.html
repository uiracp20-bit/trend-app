yc",ROUNDS=600000,KEY="tf_positions_pw";
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ROUNDS,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(DATA)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err");
f.onsubmit=async e=>{e.preventDefault();err.textContent="Opening…";
  const pw=document.getElementById("pw").value,keep=document.getElementById("keep").checked;
  try{await open_(pw);}catch(_){err.textContent="Wrong password.";return;}
  try{if(keep)localStorage.setItem(KEY,pw);}catch(_){}};
(async()=>{let pw=null;try{pw=localStorage.getItem(KEY);}catch(_){}
  if(pw){try{await open_(pw);}catch(_){try{localStorage.removeItem(KEY);}catch(_){}}}})();
})();
