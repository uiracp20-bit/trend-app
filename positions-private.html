:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#5b6472;--line:#d7dbe2;--acc:#2456d6;--bad:#c62828}

label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--mute)}
button{width:100%;font-size:16px;padding:11px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-weight:600}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

async function open_(pw){
